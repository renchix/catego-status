owner: renchix  # Replace with your actual GitHub username/org
repo: catego-status                 # Replace with your repository name

user-agent: Catego-Uptime-Bot

# List of endpoints to track
sites:
  - name: Catego AIS API
    url: https://ais.catego.app/health
  - name: AIS Admin Portal
    url: https://ais-portal.catego.app
  - name: AIS Auth Gateway (PSU frontend)
    url: https://connect.catego.app
  - name: Catego Categorization Web cabinet
    url: https://cabinet.catego.app

status-website:
  # Add your custom domain here:
  cname: status.catego.app
  
  # DELETE OR COMMENT OUT THIS LINE:
  # baseUrl: /catego-status
  
  logoUrl: https://connect.catego.app/favicon.svg
  favicon: https://connect.catego.app/favicon.svg
  name: Catego System Status
  introTitle: "Real-time system status of Catego Open-banking (AIS) and Catego Categorization"
  introMessage: "Welcome to the Catego API status page where you can monitor API uptime and operational health."
  
  # Inject Catego Branding
  customCss: |
    :root {
      /* Base Colors */
      --color-primary: #f5793b;
      --color-primary-dark: #e0682e;
      --color-text: #0f172a;
      --color-background: #f8fafc;
    }
    
    /* Dark Slate Header */
    nav {
      background-color: #0f172a !important;
    }
    nav a {
      color: #ffffff !important;
    }
    nav h1 {
      color: #ffffff !important;
    }

    /* Orange Links and Buttons */
    a {
      color: var(--color-primary);
    }
    a:hover {
      color: var(--color-primary-dark);
    }
    
    /* Footer tweaks */
    footer {
      color: #64748b;
      background-color: #f1f5f9;
    }
i18n:
  footer: "© 2026 Catego SIA. All rights reserved."
